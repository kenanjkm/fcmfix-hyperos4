name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Retrieve version name
      run: echo VERSION_NAME=hyperos4-$(date "+%Y%m%d")_$(echo ${{ github.sha }} | head -c 7) >> $GITHUB_ENV

    - name: Retrieve version code
      run: echo VERSION_CODE=$(grep "versionCode" app/build.gradle | grep -Eo "[0-9]+") >> $GITHUB_ENV

    - name: Set version name
      run: sed -i "s/versionName \".*\"/versionName \"${{ env.VERSION_NAME }}\"/" app/build.gradle

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Sign APK
      env:
        KEYSTORE_B64: ${{ secrets.SIGNINGKEYBASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
        KEY_ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
      run: |
        if [ -z "$KEYSTORE_B64" ]; then
          echo "::error::Signing secrets are missing (SIGNINGKEYBASE64, KEYSTOREPASSWORD, ALIAS, KEYPASSWORD)"
          exit 1
        fi
        BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
        IN=app/build/outputs/apk/release/app-release-unsigned.apk
        OUT=app/build/outputs/apk/release/fcmfix-${VERSION_NAME}.apk
        "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
        "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
          --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" "$RUNNER_TEMP/aligned.apk"
        "$BT/apksigner" verify --print-certs "$OUT" | head -2
        rm -f "$RUNNER_TEMP/release.jks"

    - name: Upload built apk
      uses: actions/upload-artifact@v4
      with:
        name: fcmfix-${{ env.VERSION_NAME }}
        path: app/build/outputs/apk/release/fcmfix-${{ env.VERSION_NAME }}.apk

    - name: Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        name: "fcmfix HyperOS 4 ${{ env.VERSION_NAME }}"
        tag_name: ${{ env.VERSION_CODE }}-${{ env.VERSION_NAME }}
        files: |
          app/build/outputs/apk/release/fcmfix-${{ env.VERSION_NAME }}.apk
